[package]
name = "devdeck-ui"
description = "devdeck theme and shared components; the only crate that sets raw sizes"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# No doctests: `cargo test` does not run rustdoc on this crate (docs/WORKFLOW.md).
doctest = false

[dependencies]
devdeck-core.workspace = true
gpui.workspace = true
unicode-segmentation = "1"
gpui-component.workspace = true
gpui-kit-assets.workspace = true

[dev-dependencies]
# Components are tested on their own, in a host window (tests/ui/common).
gpui = { workspace = true, features = ["test-support"] }
