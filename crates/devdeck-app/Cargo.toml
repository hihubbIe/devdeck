[package]
name = "devdeck-app"
description = "devdeck desktop app"
version.workspace = true
edition.workspace = true
publish.workspace = true
# `cargo run -p devdeck-app` runs the app, not the snapshot tool.
default-run = "devdeck"

[[bin]]
name = "devdeck"
path = "src/main.rs"

# Renders layout states to PNG files offscreen for visual checks (docs/WORKFLOW.md).
[[bin]]
name = "devdeck-snapshot"
path = "src/bin/snapshot.rs"
required-features = ["snapshot"]

[features]
# Builds GPUI with its profiler so input-to-present latency can be reported
# (DEVDECK_LATENCY=1). Memory is measured without it.
profile = ["gpui/profiler"]
snapshot = ["gpui/test-support", "gpui_platform/test-support", "dep:image"]

[dependencies]
devdeck-core.workspace = true
devdeck-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
notify-debouncer-full.workspace = true
rustix.workspace = true
signal-hook.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
async-channel.workspace = true
futures-lite.workspace = true
devdeck-kube.workspace = true
devdeck-api.workspace = true
libc.workspace = true
uuid.workspace = true
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
