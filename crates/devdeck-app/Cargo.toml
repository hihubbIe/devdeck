[package]
name = "devdeck-app"
description = "devdeck desktop app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# No doctests: `cargo test` does not run rustdoc on this crate (docs/WORKFLOW.md).
doctest = false

# The app's own binary is the `devdeck` package (crates/devdeck). This one renders layout
# states to PNG files offscreen for visual checks (docs/WORKFLOW.md).
[[bin]]
name = "devdeck-snapshot"
path = "src/bin/snapshot.rs"
required-features = ["snapshot"]

[features]
# The `profile` build is the binary's feature (crates/devdeck).
snapshot = ["gpui/test-support", "gpui_platform/test-support", "dep:image"]

[dependencies]
devdeck-core.workspace = true
devdeck-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
notify-debouncer-full.workspace = true
rustix.workspace = true
devdeck-sys.workspace = true
log.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
async-channel.workspace = true
futures-lite.workspace = true
devdeck-kube.workspace = true
devdeck-api.workspace = true
libc.workspace = true
regex.workspace = true
uuid.workspace = true
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
