[workspace]
resolver = "3"
members = ["crates/devdeck-core", "crates/devdeck-ui", "crates/devdeck-kube", "crates/devdeck-app", "crates/devdeck-api", "crates/devdeck-ctl", "crates/devdeck-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
devdeck-core = { path = "crates/devdeck-core" }
devdeck-ui = { path = "crates/devdeck-ui" }
devdeck-kube = { path = "crates/devdeck-kube" }
devdeck-api = { path = "crates/devdeck-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
proptest = "1"
# GPUI: published snapshot of Zed's GPUI (crates.io `gpui` is a year old). See docs/DESIGN.md.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["wayland", "x11"] }
async-channel = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
# `runtime`: the watcher behind the cluster driver (M3).
kube = { version = "=5.0.0", features = ["runtime"] }
# Terminal emulation and pseudo-terminals for runs (what Zed uses). See docs/plans/M2-runner.md.
alacritty_terminal = "=0.26.0"
futures-lite = "2"
# M2 step 2 (docs/plans/M2-runner.md): folder watching, Taskfile/compose (YAML, safe Rust,
# already in the tree through kube), launch.json (JSONC), killing process groups.
notify = "=8.2.0"
notify-debouncer-full = "=0.7.0"
serde-saphyr = "2"
jsonc-parser = { version = "=0.34.0", features = ["serde"] }
rustix = { version = "1", features = ["process", "pty", "termios", "fs", "event", "stdio", "net"] }
# The control API's `SO_PEERPIDFD` (rustix has no wrapper for it).
libc = "0.2"
signal-hook = "=0.4.5"
k8s-openapi = { version = "=0.29.0", features = ["earliest"] }
# Ids of things that have only a name to show (layouts).
uuid = { version = "1", features = ["v4"] }
# Files and notes (docs/plans/files-and-notes.md): the editor and the Markdown view, with
# tree-sitter highlighting for the languages listed only. Pins `gpui-pre =0.3.11` like us.
gpui-component = { version = "=0.9.0", features = [
    "tree-sitter-rust", "tree-sitter-go", "tree-sitter-typescript", "tree-sitter-tsx",
    "tree-sitter-javascript", "tree-sitter-yaml", "tree-sitter-toml",
    "tree-sitter-markdown", "tree-sitter-markdown-inline", "tree-sitter-bash", "tree-sitter-css",
    "tree-sitter-html", "tree-sitter-python", "tree-sitter-make", "tree-sitter-diff", "tree-sitter-sql",
] }
# Its icons (Lucide), served for the editor's find bar.
gpui-kit-assets = "=0.9.0"
# Control API (docs/plans/control-api-p1.md): its methods' JSON schemas. The version
# gpui already brings in, so there is one copy.
schemars = "=1.2.3"
# The control API's searches in output (linear time, already in the tree).
regex = "1"
# The MCP server over the control API (devdeck-mcp only; docs/plans/control-api-p1.md).
# Exact: it changes about weekly.
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Snapshots spend most of their time compressing PNGs; unoptimized, that is ~2 s per image.
# Only these small crates are optimized, so the app's own debug build is unchanged.
[profile.dev.package]
png = { opt-level = 3 }
fdeflate = { opt-level = 3 }
flate2 = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
simd-adler32 = { opt-level = 3 }
crc32fast = { opt-level = 3 }
image = { opt-level = 3 }
