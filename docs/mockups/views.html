<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devdeck views mockup</title>
<!-- Pure mockup, fake data: one page for every activity's full view, edited as each is planned. -->
<style>
:root {
  --bg: #0f1012; --bar: #15161a; --raised: #1c1d22; --line: #30333a;
  --fg: #e1e2e5; --mute: #8d9099; --dim: #666a73; --accent: #64a6e3;
  --ok: #67c174; --warn: #e3ad48; --err: #eb7474; --env: #cbbdf7; --env-bg: #2d2645;
  --hover: #1f2126; --selected: #23324a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
  font: 13px/24px "JetBrains Mono", ui-monospace, monospace; overflow: hidden; }
svg.i { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.app { display: flex; flex-direction: column; height: 100%; }
.title { height: 32px; flex: none; display: flex; align-items: center; gap: 18px; padding: 0 12px; background: var(--bar); border-bottom: 1px solid var(--line); color: var(--mute); }
.title .ctl { display: flex; align-items: center; gap: 4px; }
.chip { color: var(--env); background: var(--env-bg); padding: 0 6px; border-radius: 3px; white-space: nowrap; }
.tag { color: var(--mute); border: 1px solid var(--line); padding: 0 6px; line-height: 20px; border-radius: 3px; white-space: nowrap; }
.badge { position: fixed; right: 12px; bottom: 6px; color: var(--dim); font-size: 11px; pointer-events: none; }
.body { flex: 1; display: flex; min-height: 0; }
.acts { width: 44px; flex: none; background: var(--bar); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding-top: 4px; gap: 4px; }
.act { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--mute); position: relative; cursor: pointer; }
.act svg.i { width: 18px; height: 18px; }
.act:hover, .act.on { color: var(--fg); }
.act.on::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; background: var(--accent); }
[data-tip] { position: relative; }
[data-tip]:hover::after { content: attr(data-tip); position: absolute; top: calc(100% + 4px); left: 50%; transform: translateX(-50%); background: var(--raised); border: 1px solid var(--line); padding: 0 8px; white-space: nowrap; z-index: 20; color: var(--fg); font-size: 12px; line-height: 22px; pointer-events: none; }
.act[data-tip]:hover::after { top: 10px; left: 48px; transform: none; }
.main { flex: 1; display: flex; min-width: 0; }
.side { width: 260px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.head { height: 32px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
.head .t { font-weight: 600; }
.filter { margin: 0 8px 4px; height: 24px; border: 1px solid var(--line); color: var(--dim); padding: 0 8px; display: flex; align-items: center; }
.sec { color: var(--mute); font-size: 11px; padding: 0 8px; display: flex; align-items: center; gap: 4px; letter-spacing: .05em; }
.row { height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 8px; cursor: default; white-space: nowrap; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--selected); }
.row .n { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row .r { margin-left: auto; color: var(--mute); padding-left: 12px; flex: none; display: flex; }
.row.dim .n { color: var(--mute); }
.empty { color: var(--dim); padding: 0 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; border: 1.5px solid var(--dim); }
.dot.on { background: var(--ok); border-color: var(--ok); }
.dot.err { background: var(--err); border-color: var(--err); }
.dot.busy { border-color: var(--warn); border-style: dashed; }
.dot.err { background: var(--err); border-color: var(--err); }
.warn { color: var(--warn); } .okc { color: var(--ok); } .errc { color: var(--err); } .mute { color: var(--mute); } .dimc { color: var(--dim); }
.split { flex: 1; display: flex; min-width: 0; }
.pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
.pane:last-child { border-right: 0; }
.col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.col > .pane { border-right: 0; border-bottom: 1px solid var(--line); }
.col > .pane:last-child { border-bottom: 0; }
.tabs { height: 32px; flex: none; background: var(--bar); display: flex; border-bottom: 1px solid var(--line); }
.tab { padding: 0 12px; display: flex; align-items: center; gap: 6px; color: var(--mute); border-right: 1px solid var(--line); white-space: nowrap; }
.tab.on { color: var(--fg); background: var(--bg); box-shadow: inset 0 2px 0 var(--accent); }
.content { flex: 1; overflow: hidden; padding: 4px 12px; color: var(--mute); white-space: pre; }
.content .ok { color: var(--ok); } .content .w { color: var(--warn); } .content .e { color: var(--err); }
.divider { width: 5px; flex: none; cursor: col-resize; background: linear-gradient(to right, transparent 2px, var(--line) 2px, var(--line) 3px, transparent 3px); }
.divider:hover { background: linear-gradient(to right, transparent 2px, var(--accent) 2px, var(--accent) 3px, transparent 3px); }
.list { display: flex; flex-direction: column; min-width: 0; flex: none; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; }
.details { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.dhead { height: 36px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--bar); white-space: nowrap; }
.dhead .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.dhead .crumb { color: var(--mute); cursor: pointer; } .dhead .crumb:hover { color: var(--accent); }
.ib { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; color: var(--mute); cursor: pointer; flex: none; }
.ib:hover { color: var(--fg); background: var(--hover); }
.ib.danger:hover { color: var(--warn); }
.ib.off { color: var(--dim); cursor: default; } .ib.off:hover { background: none; }
.ib .corner { position: absolute; right: 1px; top: 1px; width: 9px; height: 9px; stroke-width: 3; }
.ibs { display: flex; gap: 2px; align-items: center; }
.grow { flex: 1; }
.cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0 24px; padding: 4px 12px 12px; }
.block { padding-top: 10px; min-width: 0; }
.label { color: var(--mute); font-size: 11px; letter-spacing: .05em; display: flex; align-items: center; gap: 6px; height: 26px; }
.label .ibs { margin-left: auto; }
.line { height: 26px; display: flex; align-items: center; gap: 8px; padding: 0 6px; margin: 0 -6px; white-space: nowrap; min-width: 0; }
.line.click { cursor: pointer; }
.line:hover { background: var(--hover); }
.line .n { overflow: hidden; text-overflow: ellipsis; flex: none; }
.line .w140 { width: 130px; } .line .w90 { width: 90px; } .line .w70 { width: 64px; }
.line .s { color: var(--mute); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.line .ibs { margin-left: auto; opacity: .0; }
.line:hover .ibs { opacity: 1; }
.line .ibs.keep { opacity: 1; }
.hint { color: var(--dim); padding: 4px 12px; border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
.blank { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--dim); }
.menu { position: fixed; background: var(--raised); border: 1px solid var(--line); box-shadow: 0 6px 18px #0008; min-width: 220px; z-index: 30; padding: 4px 0; }
.menu .mi { height: 24px; display: flex; align-items: center; gap: 8px; padding: 0 12px; white-space: nowrap; cursor: default; }
.menu .mi:hover { background: var(--selected); }
.menu .mi.head { color: var(--mute); font-size: 11px; } .menu .mi.head:hover { background: none; }
.menu .mi .k { width: 12px; color: var(--accent); }
.menu .sep { height: 1px; background: var(--line); margin: 4px 0; }
.toast { position: fixed; right: 16px; bottom: 30px; background: var(--raised); border: 1px solid var(--line); padding: 4px 12px; display: none; gap: 8px; align-items: center; z-index: 40; }
.veil { position: fixed; inset: 0; background: #0009; display: flex; align-items: center; justify-content: center; z-index: 50; }
.modal { background: var(--raised); border: 1px solid var(--line); width: 520px; padding: 12px 16px; box-shadow: 0 8px 24px #000a; }
.modal .mt { font-weight: 600; margin-bottom: 6px; }
.modal .mb { color: var(--mute); white-space: normal; }
.modal .mb code { color: var(--fg); }
.modal .mf { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.modal .b { border: 1px solid var(--line); padding: 0 12px; cursor: pointer; }
.modal .b.focus { outline: 1px solid var(--accent); }
.modal .b.go { color: var(--warn); }
.pods { display: inline-flex; gap: 2px; align-items: center; }
.pods i { width: 10px; height: 10px; border-radius: 2px; background: var(--ok); display: inline-block; }
.pods i.start { background: none; border: 1.5px dashed var(--warn); }
.pods i.fail { background: var(--err); }
.pods i.old { background: var(--dim); }
.ab { display: inline-flex; align-items: center; gap: 4px; color: var(--mute); }
.ab .half { width: 48px; height: 8px; display: flex; background: var(--raised); }
.ab .half.l { justify-content: flex-end; }
.ab .half b { display: block; height: 100%; }
.ab .mid { width: 1px; height: 12px; background: var(--line); }
.stack { display: inline-flex; width: 120px; height: 8px; background: var(--raised); }
.stack b { display: block; height: 100%; }
.link { cursor: pointer; display: inline-flex; align-items: center; gap: 3px; }
.link:hover { color: var(--accent); }
.todo { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--mute); gap: 6px; }
.todo b { color: var(--fg); }
/* Cluster */
.fields { display: flex; flex-wrap: wrap; gap: 6px 28px; padding: 8px 10px 4px; }
.fld { min-width: 0; }
.fk { color: var(--dim); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
.fv { white-space: nowrap; display: flex; align-items: center; min-height: 22px; }
.inrow { margin: 0 6px 8px 28px; border-left: 2px solid var(--line); padding-left: 8px; }
.inrow .sub { margin-top: 6px; }
.envtags { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 2px 10px 6px; }
.envtag { display: inline-flex; gap: 6px; color: var(--mute); }
.envtag.on { color: var(--fg); }
.abtn.small { height: 22px; padding: 0 8px; }
.facts { display: flex; gap: 14px; padding: 6px 12px 0; white-space: nowrap; overflow: hidden; color: var(--mute); }
.acts-row { display: flex; gap: 6px; padding: 6px 8px; flex-wrap: wrap; }
.abtn { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 1px solid var(--line); border-radius: 3px; color: var(--fg); cursor: pointer; white-space: nowrap; }
.abtn:hover { background: var(--hover); }
.abtn.primary { color: var(--accent); border-color: var(--accent); }
.abtn.danger:hover { color: var(--warn); }
.modal.picker { width: 640px; padding: 0; }
.modal.picker .mt { padding: 10px 14px 6px; }
.pin { width: calc(100% - 28px); margin: 0 14px; height: 30px; background: var(--bg); border: 1px solid var(--accent); border-radius: 3px; color: var(--fg); font: inherit; padding: 0 8px; outline: none; }
.pfs { display: flex; gap: 6px; padding: 8px 14px 4px; }
.pf { padding: 0 8px; line-height: 20px; border: 1px solid var(--line); border-radius: 10px; color: var(--mute); cursor: pointer; }
.pf.on { color: var(--fg); background: var(--selected); border-color: var(--selected); }
.plist { max-height: 320px; overflow: auto; padding: 4px 6px; }
.pg { color: var(--dim); font-size: 11px; letter-spacing: .05em; padding: 6px 8px 2px; }
.po { display: grid; grid-template-columns: minmax(120px, 1fr) auto 220px; gap: 10px; align-items: center; height: 26px; padding: 0 8px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
.po > * { overflow: hidden; text-overflow: ellipsis; }
.po.on, .po:hover { background: var(--selected); }
.po .pd { color: var(--mute); text-align: right; }
.pfoot { color: var(--dim); padding: 6px 14px 10px; border-top: 1px solid var(--line); margin-top: 4px; }
.panel { background: var(--bar); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; min-width: 0; }
.panel .ph { height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1px solid #262930; color: var(--mute); }
.panel .pb { padding: 4px; overflow-x: auto; }
.dash { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px; align-content: flex-start; }
.dash .c3 { flex: 3 1 0; min-width: 380px; display: flex; flex-direction: column; gap: 12px; }
.dash .c2 { flex: 2 1 0; min-width: 300px; display: flex; flex-direction: column; gap: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg span { padding: 0 8px; line-height: 22px; color: var(--mute); cursor: pointer; }
.seg span.on { background: var(--selected); color: var(--fg); }
.drow { height: 26px; display: flex; align-items: center; gap: 8px; padding: 0 8px; cursor: default; white-space: nowrap; }
.drow:hover { background: var(--hover); }
.drow.sel { background: var(--selected); }
.drow .n { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.prow { height: 24px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 34px; color: var(--mute); white-space: nowrap; cursor: default; }
.prow:hover { background: var(--hover); color: var(--fg); }
.prow.sel { background: var(--selected); color: var(--fg); }
.ubar { position: relative; width: 70px; height: 7px; background: var(--line); border-radius: 2px; flex: none; }
.ubar b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }
.ubar i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--fg); }
.tr { display: grid; grid-template-columns: var(--cols); align-items: center; column-gap: 10px; height: 26px; padding: 0 8px; white-space: nowrap; cursor: default; }
.tr > * { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.tr:hover { background: var(--hover); }
.tr.sel { background: var(--selected); }
.tr.th { color: var(--dim); font-size: 11px; letter-spacing: .05em; height: 22px; border-bottom: 1px solid #262930; }
.tr.th:hover { background: none; }
.tr.pod { color: var(--mute); height: 24px; }
.tr .r { text-align: right; }
.cellrow { display: flex; align-items: center; gap: 6px; }
.mx { border-collapse: collapse; white-space: nowrap; table-layout: fixed; }
.mx th, .mx td { overflow: hidden; text-overflow: ellipsis; }
.mx th { color: var(--mute); font-weight: normal; text-align: left; padding: 0 10px; height: 26px; position: sticky; top: 0; background: var(--bg); }
.mx td { padding: 0 10px; height: 26px; border-top: 1px solid #22252b; cursor: pointer; }
.mx td:hover { background: var(--hover); }
.mx td.sel { background: var(--selected); }
.mx td.first { color: var(--fg); cursor: default; }
.pick { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 4px; margin: 4px 8px 8px; max-height: 220px; overflow: auto; background: var(--raised); }
.pick .g { color: var(--dim); font-size: 11px; padding: 4px 8px 0; letter-spacing: .05em; }
.pick .o { height: 24px; display: flex; align-items: center; gap: 8px; padding: 0 8px; cursor: pointer; white-space: nowrap; }
.pick .o:hover { background: var(--selected); }
.field { flex: 1; height: 26px; border: 1px solid var(--line); border-radius: 3px; display: flex; align-items: center; padding: 0 8px; gap: 6px; min-width: 0; background: var(--bg); }
.go { color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; height: 26px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
</style>
</head>

const deployed = () => flat(APPS).filter(a => a.deploy).map(a => ({ name: a.id, tag: a.deploy, rolling: a.rolling }))
  .concat([{ name: 'frontendapp', tag: svc('v1.0.0', 'v1.0.0', 'v1.0.0', 'v1.0.0', 'v1.0.0'), parts: PARTS }]).sort((a, b) => a.name.localeCompare(b.name));
const podsOf = (d, env) => {
  if (d.name === 'proxyapi') return []; // scaled to 0: stopped
  const n = d.parts ? 1 : d.name.length % 2 ? 3 : 2, rolling = d.rolling === env, failing = d.name === 'reportservicev2';
  return Array.from({ length: n }, (_, i) => ({
    name: `${d.name}-${d.parts ? '5df496b96d' : `7d9f${(d.name.length * 7 + i * 13) % 97}c`}-${['8ggsd', 'p9m1z', 'b7r3w'][i]}`,
    state: rolling && i === n - 1 ? 'starting' : failing && i === n - 1 ? 'failing' : 'ready', restarts: failing && i === n - 1 ? 12 : i === 1 && d.name.length % 3 === 0 ? 4 : 0,
    age: rolling && i === n - 1 ? '20s' : d.parts ? '21h' : `${2 + i}d`, cpu: 8 + (i * 17 + d.name.length * 5) % 60, mem: 30 + (i * 23 + d.name.length * 3) % 55,
  }));
};
// A state word, colored by how much it matters: all is well muted, under way a warning,
// broken an error, nothing running dim.
const STATE_COLOR = { running: 'mute', ready: 'mute', 'rolling out': 'warn', starting: 'warn', failing: 'errc', stopped: 'dimc', terminating: 'dimc', completed: 'mute' };
const stateWord = w => `<span class="${STATE_COLOR[w]}">${w}</span>`;
const square = st => `<span class="pods"><i class="${st === 'starting' ? 'start' : st === 'failing' ? 'fail' : st === 'terminating' ? 'old' : ''}"></i></span>`;
const depState = (pods, rolling) => pods.length === 0 ? 'stopped' : pods.some(p => p.state === 'failing') ? 'failing' : rolling ? 'rolling out' : 'running';
const ubar = (pct, req) => `<span class="ubar"><b style="width:${Math.min(100, pct)}%;background:${pct > req ? 'var(--warn)' : 'var(--ok)'}"></b><i style="left:${req}%"></i></span>`;
const panel = (title, body, actions = '') => `<div class="panel"><div class="ph"><span class="grow">${title}</span>${actions}</div><div class="pb">${body}</div></div>`;
const STATE_DOT = { running: 'on', 'rolling out': 'busy', failing: 'err', stopped: '' };
// A group's actions, together, in its body (never hoisted into a header).
const actionsRow = btns => `<div class="acts-row">${btns.join('')}</div>`;
const btn = (icon, text, attrs = '', cls = '') => `<span class="abtn ${cls}" ${attrs}>${ic(icon)}${text}</span>`;

// The picker (one devdeck-ui component for every "pick one of many": deploying a branch,
// the palette, the help, switching branch…): a modal, its search focused at once, filter
// chips, groups, the keyboard; the caller gives the options and what a pick does.
function openPicker({ title, placeholder, filters, groups, onPick }) {
  const v = document.createElement('div'); v.className = 'veil';
  let filter = filters ? filters[0] : null, q = '', at = 0;
  const visible = () => groups.map(g => ({ ...g, options: g.options.filter(o => (!filter || filter === 'all' || o.kind === filter) && (o.label + ' ' + (o.detail || '')).toLowerCase().includes(q.toLowerCase())) })).filter(g => g.options.length);
  const draw = () => {
    const gs = visible(); const flatOpts = gs.flatMap(g => g.options); at = Math.min(at, Math.max(0, flatOpts.length - 1));
    let n = -1;
    v.querySelector('.plist').innerHTML = gs.map(g => `<div class="pg">${g.label}</div>` + g.options.map(o => { n++; return `<div class="po ${n === at ? 'on' : ''}" data-po="${n}"><span class="pl">${o.label}</span>${(o.chips || []).map(c => `<span class="chip">${c}</span>`).join('')}<span class="pd">${o.detail || ''}</span></div>`; }).join('')).join('') || '<div class="pg">nothing matches</div>';
    v.querySelectorAll('.pf').forEach(el => el.classList.toggle('on', el.dataset.pf === filter));
    return flatOpts;
  };
  v.innerHTML = `<div class="modal picker"><div class="mt">${title}</div><input class="pin" placeholder="${placeholder}">
    ${filters ? `<div class="pfs">${filters.map(f => `<span class="pf" data-pf="${f}">${f}</span>`).join('')}</div>` : ''}<div class="plist"></div>
    </div>`;
  document.body.appendChild(v);
  const input = v.querySelector('.pin'); input.focus(); let opts = draw();
  const pick = o => { v.remove(); onPick(o); };
  input.addEventListener('input', () => { q = input.value; at = 0; opts = draw(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { at = Math.min(opts.length - 1, at + 1); opts = draw(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { at = Math.max(0, at - 1); opts = draw(); e.preventDefault(); }
    if (e.key === 'Enter' && opts[at]) pick(opts[at]);
    if (e.key === 'Escape') v.remove();
    e.stopPropagation();
  });
  v.addEventListener('click', e => {
    const f = e.target.closest('[data-pf]'); if (f) { filter = f.dataset.pf; at = 0; opts = draw(); input.focus(); return; }
    const o = e.target.closest('[data-po]'); if (o) { pick(opts[+o.dataset.po]); return; }
    if (e.target === v) v.remove();
  });
}

// A table in a panel: `cols` the data columns' fixed widths after a name that takes the

const trow = (cols, cells, attrs = '') => `<div class="tr" style="--cols:minmax(120px,1fr) ${cols}" ${attrs}>${cells.join('')}</div>`;

// A summary card's fields: a small caption over its value, side by side.
const fields = list => `<div class="fields">${list.filter(Boolean).map(([k, v]) => `<div class="fld"><div class="fk">${k}</div><div class="fv">${v}</div></div>`).join('')}</div>`;

function clusterDetails() {
  const d = deployed().find(x => x.name === CL.sel);

  const pods = podsOf(d, CL.env), st = depState(pods, d.rolling === CL.env), env = CL.env, prot = env === 'dev31';

    return row + `<div class="inrow">${fields([['Init container', `init-${x.app}`], ['Deployed', '2 h ago · j.doe'], ['Config', `<span style="color:var(--accent);cursor:pointer" data-cl-config>${x.app}.yml</span>`]])}<div class="envtags">${envTags}</div></div>`;
  }))) : '';

  // Pods: a row opens in place: its facts, containers, startup, env and its actions.
  const P = '92px 44px 64px 130px 130px';
  const usageCell = (v, req, text) => `<span class="cellrow">${ubar(v, req)}<span class="mute">${text}</span></span>`;
  const podDetail = p => {
    const K = '120px 140px 90px';
    const containers = [{ n: d.parts ? 'frontendapp-nginx' : d.name, ports: d.parts ? '8080–8088' : '8080', probe: 'GET /healthz' }, ...(d.parts ? [] : [{ n: 'istio-proxy', ports: '15090', probe: '—' }])];

  const history = panel('History', table('110px 190px', ['WHEN', 'WHO', 'CHANGE'], [['2 h ago', 'j.doe', `${d.tag.dev33} → ${d.tag[env]}`], ['1 d ago', 'f.lastname', '1.63.9 → 1.64.0'], ['3 d ago', 'ci', '1.63.8 → 1.63.9']].map(h => trow('110px 190px', [`<span class="mute">${h[0]}</span>`, `<span>${h[1]}</span>`, `<span class="mute">${h[2]}</span>`]))));
  const envs = d.parts ? '' : panel('Envs', table('170px 64px', ['ENV', 'TAG', 'PODS'], ENVS.map(e => {

function deployModal(a, env) {

}
function closeModal(go) { document.querySelector('.veil')?.remove(); if (go) toast(go); }

document.addEventListener('click', e => {
  const m = e.target.closest('[data-modal]');
  if (m) { closeModal(m.dataset.modal === 'go' ? `deploying ${S.act === 'cluster' ? S.pendingTo : 'main'} to ${S.pendingEnv}…` : null); return; }
  const mi = e.target.closest('.mi');
  if (mi) { const d = mi.dataset.do; if (d.startsWith('toast:')) toast(d.slice(6)); if (d.startsWith('switch:')) toast(`switched to ${d.slice(7)}`); closeMenu(); return; }
  if (menuEl && !e.target.closest('.menu')) closeMenu();
  if (S.act === 'cluster') {
    const t = e.target;
    const mode = t.closest('[data-cl-mode]'); if (mode) { CL.mode = mode.dataset.clMode; render(); return; }
    const tog = t.closest('[data-cl-toggle]'); if (tog) { CL.open[tog.dataset.clToggle] = !CL.open[tog.dataset.clToggle]; render(); return; }
    const op = t.closest('[data-cl-open]'); if (op) { const [set, k] = op.dataset.clOpen.split('|'); CL[set][k] = !CL[set][k]; render(); return; }
    const pl = t.closest('[data-cl-podlogs]'); if (pl) { CL.podLogs = pl.dataset.clPodlogs; render(); return; }
    const dep = t.closest('[data-cl-dep]'); if (dep) { CL.sel = dep.dataset.clDep; CL.podLogs = ''; render(); return; }
    const cell = t.closest('[data-cl-cell]'); if (cell) { const [d, env] = cell.dataset.clCell.split('|'); CL.sel = d; CL.env = env; CL.mode = 'env'; render(); return; }
    const envRow = t.closest('[data-cl-env]'); if (envRow) { CL.env = envRow.dataset.clEnv; render(); return; }
    const dp = t.closest('[data-cl-deploy]');
    if (dp) {
      const d = deployed().find(x => x.name === CL.sel), p = dp.dataset.clDeploy && d.parts.find(x => x.app === dp.dataset.clDeploy);
      deployPicker(d.name, CL.env, p ? p.tag : d.tag, p ? p.app : null); return;
    }
    if (t.closest('[data-cl-redeploy]')) { toast('redeploy: asks first, then restarts its pods on the same image'); return; }
    if (t.closest('[data-cl-forward]')) { openPicker({ title: 'Port-forward to localhost', placeholder: 'search ports', groups: [{ label: 'ITS PORTS', options: [8080, 8081, 8082, 8083, 8084, 8085, 8088].map(n => ({ value: n, label: `:${n}`, detail: { 8080: 'nginx', 8081: 'cbapp-http', 8082: 'mtapp-http', 8083: 'monapp-http', 8084: 'rdapp-http', 8085: 'shapp-http', 8088: 'fcdn-http' }[n] })) }], onPick: o => toast(`localhost:${o.value} → pod :${o.value}`) }); return; }
    if (t.closest('[data-cl-shell]')) { toast('asks first, then a terminal in the pod'); return; }
    if (t.closest('[data-cl-config]')) { toast('the configmap file, read only, in a modal'); return; }
    const pm = t.closest('[data-pulse-menu]'); if (pm) { const r = pm.getBoundingClientRect(); openMenu(r.right - 220, r.bottom + 2, pulseItems(pm.dataset.pulseMenu)); e.stopPropagation(); return; }
    const pv = t.closest('[data-pivot]'); if (pv) { S.act = 'apps'; S.sel = CL.sel; S.drill = null; render(); return; }
    return;
  }
  if (S.act !== 'apps') return;
  const a = byId(S.sel);
  const pm = e.target.closest('[data-pulse-menu]');
  if (pm) { const r = pm.getBoundingClientRect(); openMenu(r.right - 220, r.bottom + 2, pulseItems(pm.dataset.pulseMenu)); e.stopPropagation(); return; }
  const pv = e.target.closest('[data-pivot]');
  if (pv && !e.target.closest('[data-deploy]')) {
    const where = { cluster: `Cluster: ${a.id} on ${pv.dataset.env || 'dev35'}`, terminals: 'Terminals: that shell', ports: 'Ports: :5800' }[pv.dataset.pivot];
    if (pv.dataset.pivot === 'cluster') { const fe = a.id.startsWith('front-end/'); CL.sel = fe ? 'frontendapp' : a.id; if (fe) CL.parts[nameOf(a)] = true; CL.env = pv.dataset.env || CL.env; CL.mode = 'env'; }
    S.act = pv.dataset.pivot; S.drill = null; render(); toast(`→ ${where} (selected there)`); e.stopPropagation(); return;
  }
  const dep = e.target.closest('[data-deploy]');
  if (dep) { S.pendingEnv = dep.dataset.deploy; deployModal(a, dep.dataset.deploy); e.stopPropagation(); return; }
  const sw = e.target.closest('[data-switch]');
  if (sw) { const r = sw.getBoundingClientRect(); openMenu(r.left, r.bottom + 2, [{ label: 'switch to', head: true }, ...['main', 'feature/geo-index', 'fix/lan-175-null-tags', 'chore/bump-go-1.22'].map(b => ({ label: b, check: b === (a.branch || 'main'), do: `switch:${b}` }))]); e.stopPropagation(); return; }
  const swt = e.target.closest('[data-switch-to]');
  if (swt) { toast(`switched to ${swt.dataset.switchTo}`); return; }
  if (e.target.closest('.ib') && !e.target.closest('[data-drill],[data-back],[data-toggle]')) { const t = e.target.closest('.ib').dataset.tip; if (!e.target.closest('.off')) toast(t.replace('…', '')); return; }
  if (e.target.closest('[data-back]')) { S.drill = null; render(); return; }
  if (e.target.closest('[data-toggle="running"]')) { S.runningOnly = !S.runningOnly; render(); return; }
  const f = e.target.closest('[data-folder]'); if (f) { S.open[f.dataset.folder] = !S.open[f.dataset.folder]; render(); return; }
  const row = e.target.closest('[data-app]'); if (row) { S.sel = row.dataset.app; S.drill = null; render(); return; }
  const d = e.target.closest('[data-drill]'); if (d) { S.drill = d.dataset.drill; render(); }
});
document.addEventListener('contextmenu', e => {
  const row = e.target.closest('[data-app]'); if (!row || S.act !== 'apps') return;
  e.preventDefault(); S.sel = row.dataset.app; S.drill = null; render();
  openMenu(e.clientX, e.clientY, [{ label: 'pin', do: 'toast:pinned' }, '-', ...pulseItems(nameOf(byId(S.sel)))]);
});

// Divider drag.
document.addEventListener('mousedown', e => {
  if (e.target.id !== 'divider') return;
  const split = document.getElementById('appsplit').getBoundingClientRect();
  const move = m => { S.listW = Math.max(0.15, Math.min(0.6, (m.clientX - split.left) / split.width)); document.querySelector('#appsplit .list').style.width = S.listW * 100 + '%'; };
  const up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
  addEventListener('mousemove', move); addEventListener('mouseup', up); e.preventDefault();
});

function render() {
  renderActs();
  const t = ACTS.find(a => a[0] === S.act)[1];
  document.getElementById('main').innerHTML = S.act === 'pulses' ? pulseView() : S.act === 'apps' ? appsView() : S.act === 'cluster' ? clusterView() : todoView(t);
}
render();
</script>
</body>
</html>
